name: Daily blog post

on:
  schedule:
    - cron: "0 6 * * *"  # 09:00 МСК
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install requests

      - name: Publish next post
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          LAOZHANG_API_KEY: ${{ secrets.LAOZHANG_API_KEY }}
        run: python publish_blog_post.py
